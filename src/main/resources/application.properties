spring.application.name=projetotcc
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
app.health.simular-falha=${APP_HEALTH_FAIL:false}
# Risco aceito: a porta 8081 nao sai da EC2 (o docker run publica so a 8080).
# nosemgrep: java.spring.security.audit.spring-actuator-non-health-enabled.spring-actuator-dangerous-endpoints-enabled
management.endpoints.web.exposure.include=health,prometheus
management.server.port=8081
management.endpoint.health.group.deploy.include=*
management.endpoint.health.group.deploy.additional-path=server:/health
management.metrics.distribution.percentiles-histogram.http.server.requests=true

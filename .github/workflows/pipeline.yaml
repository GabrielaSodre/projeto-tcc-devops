name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  continuos-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '21'

      - run: java --version

      - name: Build with Maven
        run: mvn clean install

      - name: Package app
        run: zip -r deployment.zip target/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-package
          path: deployment.zip

# O job "continous-delivery" (kind + kubectl) saiu daqui.
# Motivo: e area de CD, e estava quebrado porque k8s/deployment.yaml nao existe.
# O CD agora vive em .github/workflows/cd.yml.

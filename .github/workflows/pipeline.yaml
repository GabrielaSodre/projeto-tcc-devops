name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  continuos-integration:
    runs-on: ubuntu-lastest
    steps:
      - name: Checkout code and Set up Java
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '21'
      - run: java --version

      - name: Install Dependencies
        run: mvn install
        working-directory: src

      - name: Zip app source and dependencies
        run: |
          cd src
          zip -r ../deployment.zip
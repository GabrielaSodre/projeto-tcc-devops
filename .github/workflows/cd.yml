name: CD - Deploy

# Titulo de cada run na lista do Actions. Tres casos:
# - campo "versao" preenchido -> "ROLLBACK para <hash>"
# - disparado pelo CI          -> "Deploy: <mensagem do commit>"
# - botao com campo vazio      -> "Deploy manual da main"
# O "a && b || c" funciona como um se/senao: se "a", usa "b"; senao, usa "c".
run-name: >-
  ${{
    inputs.versao && format('ROLLBACK para {0}', inputs.versao) ||
    github.event_name == 'workflow_run' && format('Deploy: {0}', github.event.workflow_run.head_commit.message) ||
    'Deploy manual da main'
  }}

# Roda sozinho quando o CI passa, ou pelo botao "Run workflow".
# No botao, preencher o campo "versao" faz ROLLBACK para esse hash.

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Rollback: hash completo do commit (40 caracteres). Deixe vazio para subir a versao atual."
        required: false
        default: ""
      forcar:
        description: "Forcar Deploy"
        type: boolean
        default: false

env:
  # Nome fixo da imagem. O ghcr.io so aceita minusculas.
  # Se o repositorio mudar de dono ou de nome, mude aqui.
  IMAGE: ghcr.io/gabrielasodre/projeto-tcc-devops
  # A versao e o hash do commit. Cada imagem publicada recebe esse hash como tag.
  # Ordem: versao digitada no rollback > commit que o CI testou > commit atual da main.
  VERSAO: ${{ inputs.versao || github.event.workflow_run.head_sha || github.sha }}
  # Caixa "forcar" do botao. Marcada = sobe de novo mesmo se a versao ja estiver no ar.
  FORCAR: ${{ inputs.forcar }}

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na EC2
    # Roda quando o CI passou, ou quando alguem aperta o botao.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CONTAINER: projetotcc
    steps:
      - name: Conferir se os secrets existem
        # Falha com mensagem clara em vez de erro confuso de SSH.
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Falta o secret EC2_HOST. Crie a instancia e cadastre os secrets."
            exit 1
          fi

      - name: Conferir a versao
        # Um hash digitado errado para aqui, antes de tocar na EC2.
        run: |
          if ! echo "$VERSAO" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Versao invalida: '$VERSAO'"
            echo "Use o hash COMPLETO do commit, com 40 caracteres."
            exit 1
          fi
          echo "Versao que vai subir: $VERSAO"

      - name: Subir a versao via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,VERSAO,CONTAINER,FORCAR
          # O pull vem ANTES do rm de proposito.
          # Se a versao nao existir no ghcr.io, o pull falha, o "set -e" para o script
          # e a versao antiga continua no ar.
          script: |
            set -e
            docker inspect -f '{{.Config.Image}}' "$CONTAINER" > ~/versao-anterior || true
            NO_AR=$(cat ~/versao-anterior)
            if [ "$NO_AR" = "$IMAGE:$VERSAO" ] && [ "$FORCAR" != "true" ]; then
              echo "A versao $VERSAO ja esta no ar. Nada a fazer."
              exit 0
            fi
            docker pull "$IMAGE:$VERSAO"
            docker rm -f "$CONTAINER" || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE:$VERSAO"

      - name: Health check
        id: health
        # Spring Boot demora para subir. Tenta por 60s em vez de chutar um sleep.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8080/actuator/health"; then
              echo "Aplicacao no ar."
              exit 0
            fi
            echo "Tentativa $i falhou. Esperando 5s..."
            sleep 5
          done
          echo "A aplicacao nao respondeu em 60s."
          exit 1

      - name: Rollback automatico
        id: rollback
        # Confere se a versao antiga voltou de verdade.
        if: failure() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CONTAINER
          script: |
            set -e
            ANTERIOR=$(cat ~/versao-anterior)
            if [ -z "$ANTERIOR" ]; then
              echo "Nao existe versao anterior. Nada para voltar."
              exit 1
            fi
            NO_AR=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER" || true)
            if [ "$NO_AR" = "$ANTERIOR" ]; then
              echo "Versao ja instalada"
              exit 0
            fi
            echo "Voltando para $ANTERIOR"
            docker rm -f "$CONTAINER" || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$ANTERIOR"

      - name: Health check do rollback
        if: failure() && steps.rollback.outcome == 'success'
        id: health_rollback
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8080/actuator/health"; then
              echo "Aplicacao no ar."
              exit 0
            fi
            echo "Tentativa $i falhou. Esperando 5s..."
            sleep 5
          done
          echo "A aplicacao nao respondeu em 60s."
          exit 1

      - name: Registrar a versao no resumo
        # Aparece na pagina do run. E de la que voce copia o hash para um rollback futuro.
        run: |
          echo "### Versao no ar" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$VERSAO\`" >> "$GITHUB_STEP_SUMMARY"


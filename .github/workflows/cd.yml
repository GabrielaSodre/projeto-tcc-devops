name: CD - Build, Publish e Deploy

# Dispara sozinho quando o workflow de CI termina na branch main.
# Tambem pode ser disparado a mao pela aba Actions (workflow_dispatch).
on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # JOB TEMPORARIO aqui.
  # Construir e publicar a imagem e responsabilidade do CI.
  # Quando o CI adotar este job, apague-o daqui e deixe so o job "deploy".
  build-and-push:
    name: Construir e publicar imagem no ghcr.io
    # So continua se o CI passou. Sem isso, deploy de codigo quebrado.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nome-imagem.outputs.image }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empacotar o jar
        # Sem testes aqui. Quem testa e o CI, e ele ja passou.
        run: ./mvnw -B clean package -DskipTests

      # O ghcr.io so aceita nome de imagem em minusculas.
      # O repositorio e "GabrielaSodre/...", com G maiusculo, entao converte.
      - name: Montar o nome da imagem
        id: nome-imagem
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Entrar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token automatico do GitHub. Nao precisa criar secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Duas tags: "latest" para o deploy e o hash do commit para rastrear.
          tags: |
            ${{ steps.nome-imagem.outputs.image }}:latest
            ${{ steps.nome-imagem.outputs.image }}:${{ github.sha }}

  deploy:
    name: Deploy na EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      CONTAINER: projetotcc
    steps:
      - name: Conferir se os secrets existem
        # Falha com mensagem clara em vez de erro confuso de SSH.
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Falta o secret EC2_HOST. Crie a instancia e cadastre os secrets."
            exit 1
          fi

      - name: Subir a nova versao via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER
          script: |
            set -e
            docker pull "$IMAGE:latest"
            docker rm -f "$CONTAINER" || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE:latest"

      - name: Health check
        # Spring Boot demora para subir. Tenta por 60s em vez de chutar um sleep.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8080/actuator/health"; then
              echo "Aplicacao no ar."
              exit 0
            fi
            echo "Tentativa $i falhou. Esperando 5s..."
            sleep 5
          done
          echo "A aplicacao nao respondeu em 60s."
          exit 1

name: CD - Build, Publish e Deploy

# Tres jeitos de rodar:
# 1. Sozinho, quando o CI termina com sucesso na main.
# 2. Pelo botao "Run workflow", com o campo "versao" vazio: sobe a versao atual da main.
# 3. Pelo botao, com o campo "versao" preenchido: ROLLBACK.
#    Nada e construido. A EC2 so baixa e sobe essa versao antiga.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Rollback: hash completo do commit (40 caracteres). Deixe vazio para subir a versao atual."
        required: false
        default: ""

env:
  # Nome fixo da imagem. O ghcr.io so aceita minusculas.
  # Se o repositorio mudar de dono ou de nome, mude aqui.
  IMAGE: ghcr.io/gabrielasodre/projeto-tcc-devops
  # A versao e o hash do commit. Cada imagem publicada recebe esse hash como tag.
  # Ordem: versao digitada no rollback > commit que o CI testou > commit atual da main.
  VERSAO: ${{ inputs.versao || github.event.workflow_run.head_sha || github.sha }}

jobs:
  # JOB TEMPORARIO aqui.
  # Construir e publicar a imagem e responsabilidade do CI.
  # Quando o CI adotar este job, apague-o daqui e deixe so o job "deploy".
  build-and-push:
    name: Construir e publicar imagem no ghcr.io
    # Roda se o CI passou, ou no disparo manual sem versao.
    # No rollback nao roda: a imagem antiga ja esta no ghcr.io.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.versao == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
        with:
          # O commit exato da VERSAO. Sem isso, um push feito durante o CI
          # faria este job construir um commit mais novo, que o CI nao testou.
          ref: ${{ env.VERSAO }}

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empacotar o jar
        # Sem testes aqui. Quem testa e o CI, e ele ja passou.
        run: ./mvnw -B clean package -DskipTests

      - name: Entrar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token automatico do GitHub. Nao precisa criar secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # A tag com o hash e a que o deploy usa, e e ela que permite o rollback.
          # A "latest" so serve para quem quiser baixar a versao mais nova a mao.
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSAO }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy na EC2
    needs: build-and-push
    # Roda depois de uma publicacao com sucesso, ou direto no rollback.
    # O "!cancelled()" e obrigatorio: sem ele, o GitHub pula este job
    # sempre que o build-and-push e pulado, e o rollback nunca rodaria.
    if: >-
      !cancelled() && (
        needs.build-and-push.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.versao != '')
      )
    runs-on: ubuntu-latest
    env:
      CONTAINER: projetotcc
    steps:
      - name: Conferir se os secrets existem
        # Falha com mensagem clara em vez de erro confuso de SSH.
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Falta o secret EC2_HOST. Crie a instancia e cadastre os secrets."
            exit 1
          fi

      - name: Conferir a versao
        # Um hash digitado errado para aqui, antes de tocar na EC2.
        run: |
          if ! echo "$VERSAO" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Versao invalida: '$VERSAO'"
            echo "Use o hash COMPLETO do commit, com 40 caracteres."
            exit 1
          fi
          echo "Versao que vai subir: $VERSAO"

      - name: Subir a versao via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,VERSAO,CONTAINER
          # O pull vem ANTES do rm de proposito.
          # Se a versao nao existir no ghcr.io, o pull falha, o "set -e" para o script
          # e a versao antiga continua no ar.
          script: |
            set -e
            docker pull "$IMAGE:$VERSAO"
            docker rm -f "$CONTAINER" || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE:$VERSAO"

      - name: Health check
        # Spring Boot demora para subir. Tenta por 60s em vez de chutar um sleep.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8080/actuator/health"; then
              echo "Aplicacao no ar."
              exit 0
            fi
            echo "Tentativa $i falhou. Esperando 5s..."
            sleep 5
          done
          echo "A aplicacao nao respondeu em 60s."
          exit 1

      - name: Registrar a versao no resumo
        # Aparece na pagina do run. E de la que voce copia o hash para um rollback futuro.
        run: |
          echo "### Versao no ar" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$VERSAO\`" >> "$GITHUB_STEP_SUMMARY"

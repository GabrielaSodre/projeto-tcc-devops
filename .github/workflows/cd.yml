name: CD - Deploy

# Roda sozinho quando o CI passa, ou pelo botao "Run workflow".
# No botao, preencher o campo "versao" faz ROLLBACK para esse hash.

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Rollback: hash completo do commit (40 caracteres). Deixe vazio para subir a versao atual."
        required: false
        default: ""

env:
  # Nome fixo da imagem. O ghcr.io so aceita minusculas.
  # Se o repositorio mudar de dono ou de nome, mude aqui.
  IMAGE: ghcr.io/gabrielasodre/projeto-tcc-devops
  # A versao e o hash do commit. Cada imagem publicada recebe esse hash como tag.
  # Ordem: versao digitada no rollback > commit que o CI testou > commit atual da main.
  VERSAO: ${{ inputs.versao || github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy na EC2
    # Roda quando o CI passou, ou quando alguem aperta o botao.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CONTAINER: projetotcc
    steps:
      - name: Conferir se os secrets existem
        # Falha com mensagem clara em vez de erro confuso de SSH.
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Falta o secret EC2_HOST. Crie a instancia e cadastre os secrets."
            exit 1
          fi

      - name: Conferir a versao
        # Um hash digitado errado para aqui, antes de tocar na EC2.
        run: |
          if ! echo "$VERSAO" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Versao invalida: '$VERSAO'"
            echo "Use o hash COMPLETO do commit, com 40 caracteres."
            exit 1
          fi
          echo "Versao que vai subir: $VERSAO"

      - name: Subir a versao via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,VERSAO,CONTAINER
          # O pull vem ANTES do rm de proposito.
          # Se a versao nao existir no ghcr.io, o pull falha, o "set -e" para o script
          # e a versao antiga continua no ar.
          script: |
            set -e
            docker pull "$IMAGE:$VERSAO"
            docker rm -f "$CONTAINER" || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE:$VERSAO"

      - name: Health check
        # Spring Boot demora para subir. Tenta por 60s em vez de chutar um sleep.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8080/actuator/health"; then
              echo "Aplicacao no ar."
              exit 0
            fi
            echo "Tentativa $i falhou. Esperando 5s..."
            sleep 5
          done
          echo "A aplicacao nao respondeu em 60s."
          exit 1

      - name: Registrar a versao no resumo
        # Aparece na pagina do run. E de la que voce copia o hash para um rollback futuro.
        run: |
          echo "### Versao no ar" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$VERSAO\`" >> "$GITHUB_STEP_SUMMARY"

name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  continuos-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '21'

      - run: java --version

      - name: Run Unit Tests
        run: mvn clean test

      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Package app
        run: zip -r deployment.zip target/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-package
          path: deployment.zip

      - name: Entrar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token automatico do GitHub. Nao precisa criar secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # A tag com o hash e a que o deploy usa, e e ela que permite o rollback.
          # A "latest" so serve para quem quiser baixar a versao mais nova a mao.
          tags: |
            ghcr.io/gabrielasodre/projeto-tcc-devops:${{ github.sha }}
            ghcr.io/gabrielasodre/projeto-tcc-devops:latest

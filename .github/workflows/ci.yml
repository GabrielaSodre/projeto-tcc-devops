name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar o Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar o Semgrep
        run: pip install -r .github/semgrep/requirements.txt

      - name: Rodar o Semgrep
        run: semgrep scan --config p/java --config p/owasp-top-ten --metrics=off --error --sarif-output=semgrep.sarif

      - name: Enviar o SARIF para o GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif

  continuos-integration:
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          # Mesmo Java da imagem Docker (eclipse-temurin).
          # Assim os testes rodam no mesmo Java que roda na EC2.
          distribution: temurin
          java-version: '21'


      - run: java --version

      - name: Run Unit Tests
        # Roda os testes e gera o relatorio de cobertura do JaCoCo.
        # O Sonar le esse relatorio no passo seguinte.
        # O verify tambem gera o jar (fase package). Assim o jar testado e o mesmo que vai para a imagem.
        run: mvn -B verify

      - name: Cache Dependency Check Data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: dependency-check-data-${{ runner.os }}
          restore-keys: |
            dependency-check-data-

      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-check-report
          path: target/

      - name: SonarCloud Scan
        # PR do Dependabot nao recebe o SONAR_TOKEN: ele le de outro cofre de secrets.
        # Sem o token, este passo falharia. O Sonar roda depois, no push do merge no main.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=projeto-tcc-devops \
            -Dsonar.organization=projetotccdevops \
            -Dsonar.qualitygate.wait=true

      - name: Upload Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Package app
        run: zip -r deployment.zip target/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: deployment.zip

      - name: Entrar no ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token automatico do GitHub. Nao precisa criar secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # A tag com o hash e a que o deploy usa, e e ela que permite o rollback.
          # A "latest" so serve para quem quiser baixar a versao mais nova a mao.
          tags: |
            ghcr.io/gabrielasodre/projeto-tcc-devops:${{ github.sha }}
            ghcr.io/gabrielasodre/projeto-tcc-devops:latest
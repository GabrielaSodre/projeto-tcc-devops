name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  continuos-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          # Mesmo Java da imagem Docker (eclipse-temurin).
          # Assim os testes rodam no mesmo Java que roda na EC2.
          distribution: temurin
          java-version: '21'

      - run: java --version

      - name: Run Unit Tests
        run: mvn clean test

      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Upload Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Package app
        run: zip -r deployment.zip target/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: deployment.zip

      - name: Entrar no ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token automatico do GitHub. Nao precisa criar secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # A tag com o hash e a que o deploy usa, e e ela que permite o rollback.
          # A "latest" so serve para quem quiser baixar a versao mais nova a mao.
          tags: |
            ghcr.io/gabrielasodre/projeto-tcc-devops:${{ github.sha }}
            ghcr.io/gabrielasodre/projeto-tcc-devops:latest

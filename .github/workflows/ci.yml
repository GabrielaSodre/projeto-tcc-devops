name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Build_e_Testes_Unitarios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          # Mesmo Java da imagem Docker (eclipse-temurin).
          # Assim os testes rodam no mesmo Java que roda na EC2.
          distribution: temurin
          java-version: '21'

      - run: java --version

      - name: Run Unit Tests
        # Roda os testes e gera o relatorio de cobertura do JaCoCo.
        # O Sonar le esse relatorio no passo seguinte.
        # O verify tambem gera o jar (fase package). Assim o jar testado e o mesmo que vai para a imagem.
        run: mvn -B verify

      - name: Upload app package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: target/
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: target/surefire-reports/

  Seguranca_e_Qualidade_de_Codigo:
    needs:  Build_e_Testes_Unitarios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar o Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar o Semgrep
        run: pip install -r .github/semgrep/requirements.txt

      - name: Rodar o Semgrep
        run: semgrep scan --config p/java --config p/owasp-top-ten --metrics=off --error --sarif-output=semgrep.sarif

      - name: Enviar o SARIF para o GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif

      - name: Restaurar a base do OWASP
        # A key muda a cada execucao (run_id), entao nunca existe igual.
        # O restore-keys pega a base mais nova que comeca com esse prefixo.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      - name: OWASP Dependency Check
        run: mvn -B org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Salvar a base do OWASP
        # always(): salva a base atualizada mesmo quando o OWASP bloqueia o build.
        # Sem isso, a proxima execucao baixaria de novo tudo o que mudou no NVD.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ github.run_id }}

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      - name: SonarCloud Scan
        # PR do Dependabot nao recebe o SONAR_TOKEN: ele le de outro cofre de secrets.
        # Sem o token, este passo falharia. O Sonar roda depois, no push do merge no main.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=projeto-tcc-devops \
            -Dsonar.organization=projetotccdevops \
            -Dsonar.qualitygate.wait=true

  Gerar_Artefatos_para_Publicacao:
    needs: Seguranca_e_Qualidade_de_Codigo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download app package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: app-build
          path: target/

      - name: Package app
        run: zip -r deployment.zip target/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: deployment.zip

      - name: Entrar no ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token automatico do GitHub. Nao precisa criar secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # A tag com o hash e a que o deploy usa, e e ela que permite o rollback.
          # A "latest" so serve para quem quiser baixar a versao mais nova a mao.
          tags: |
            ghcr.io/gabrielasodre/projeto-tcc-devops:${{ github.sha }}
            ghcr.io/gabrielasodre/projeto-tcc-devops:latest
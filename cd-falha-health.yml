name: CD - Deploy


run-name: >-
  ${{
    inputs.versao && format('ROLLBACK para {0}', inputs.versao) ||
    github.event_name == 'workflow_run' && format('Deploy: {0}', github.event.workflow_run.head_commit.message) ||
    'Deploy manual da main'
  }}


on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Rollback: hash completo do commit (40 caracteres). Deixe vazio para subir a versao atual."
        required: false
        default: ""
      forcar:
        description: "Forcar Deploy"
        type: boolean
        default: false
      falha_health:
        description: "Experimento: simular falha no health check (rollback esperado)"
        type: boolean
        default: false

env:

  IMAGE: ghcr.io/gabrielasodre/projeto-tcc-devops
  
  VERSAO: ${{ inputs.versao || github.event.workflow_run.head_sha || github.sha }}
 
  FORCAR: ${{ inputs.forcar }}
  
  FALHA_HEALTH: ${{ inputs.falha_health && 'true' || 'false' }}

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na EC2
    
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CONTAINER: projetotcc
    steps:
      - name: Conferir se os secrets existem
       
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Falta o secret EC2_HOST. Crie a instancia e cadastre os secrets."
            exit 1
          fi

      - name: Conferir a versao
      
        run: |
          if ! echo "$VERSAO" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Versao invalida: '$VERSAO'"
            echo "Use o hash COMPLETO do commit, com 40 caracteres."
            exit 1
          fi
          echo "Versao que vai subir: $VERSAO"

      - name: Subir a versao via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,VERSAO,CONTAINER,FORCAR,FALHA_HEALTH
         
          script: |
            set -e
            docker inspect -f '{{.Config.Image}}' "$CONTAINER" > ~/versao-anterior || true
            NO_AR=$(cat ~/versao-anterior)
            if [ "$NO_AR" = "$IMAGE:$VERSAO" ] && [ "$FORCAR" != "true" ]; then
              echo "A versao $VERSAO ja esta no ar. Nada a fazer."
              exit 0
            fi
            docker pull "$IMAGE:$VERSAO"
            docker rm -f "$CONTAINER" || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -e EXPERIMENTO_FALHA_HEALTH="$FALHA_HEALTH" \
              -p 8080:8080 \
              "$IMAGE:$VERSAO"

      - name: Health check
        id: health
        
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8080/actuator/health"; then
              echo "Aplicacao no ar."
              exit 0
            fi
            echo "Tentativa $i falhou. Esperando 5s..."
            sleep 5
          done
          echo "A aplicacao nao respondeu em 60s."
          exit 1

      - name: Rollback automatico
        id: rollback
        
        if: failure() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CONTAINER
          script: |
            set -e
            ANTERIOR=$(cat ~/versao-anterior)
            if [ -z "$ANTERIOR" ]; then
              echo "Nao existe versao anterior. Nada para voltar."
              exit 1
            fi
            NO_AR=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER" || true)
            if [ "$NO_AR" = "$ANTERIOR" ]; then
              echo "Versao ja instalada"
              exit 0
            fi
            echo "Voltando para $ANTERIOR"
            docker rm -f "$CONTAINER" || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$ANTERIOR"

      - name: Health check do rollback
        if: failure() && steps.rollback.outcome == 'success'
        id: health_rollback
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8080/actuator/health"; then
              echo "Aplicacao no ar."
              exit 0
            fi
            echo "Tentativa $i falhou. Esperando 5s..."
            sleep 5
          done
          echo "A aplicacao nao respondeu em 60s."
          exit 1

      - name: Registrar a versao no resumo
       
        run: |
          echo "### Versao no ar" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$VERSAO\`" >> "$GITHUB_STEP_SUMMARY"

  teste-de-carga:
    name: Teste de carga
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o script do k6
        uses: actions/checkout@v7

      - name: Instalar o k6
        uses: grafana/setup-k6-action@v1

      - name: Rodar o k6
        run: k6 run -e HOST=${{ secrets.EC2_HOST }} k6/carga.js

